name: build

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libgl-dev \
            xvfb mesa-utils

      - name: Verify assets exist
        run: python3 tools/gen_assets.py --check

      - name: Build raylib 6.2 + game
        run: |
          make deps -j"$(nproc)"
          make -j"$(nproc)"

      - name: Map discovery check
        run: ./build/dead_arrival --list-maps

      - name: Headless autotest (all maps)
        run: |
          mkdir -p artifacts
          for m in theater cemetery trenches; do
            xvfb-run -a -s "-screen 0 1280x720x24" \
              ./build/dead_arrival --autotest "$m.map" 1800 "artifacts/$m.png"
          done

      - name: Zombie pathfinding test (all maps)
        run: |
          for m in theater cemetery trenches; do
            xvfb-run -a -s "-screen 0 1280x720x24" \
              ./build/dead_arrival --pathtest "$m.map" 75 "artifacts/path_$m.png"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots
          path: artifacts/

  # Verifies the "prefer system raylib 6.2" build path: raylib 6.2 is
  # installed system-wide first, then the plain Make build must detect and
  # link against it instead of cloning the bundled copy.
  linux-system-raylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git cmake \
            libasound2-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libgl-dev \
            xvfb mesa-utils

      - name: Install raylib 6.2 system-wide
        run: |
          git clone --depth 1 --branch 6.2 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_GAMES=OFF
          cmake --build /tmp/raylib/build -j"$(nproc)"
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig
          ls /usr/local/include/raylib.h /usr/local/lib/libraylib.a
          # raylib's cmake does not ship a pkg-config file, so the build
          # falls back to header detection - both count as "system install"
          pkg-config --modversion raylib || true

      - name: Build against system raylib
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          grep -q "system install" build.log
          test -x build/dead_arrival

      - name: Autotest with system raylib
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/dead_arrival --autotest theater.map 1800 artifacts/system_theater.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots-system-raylib
          path: artifacts/

  # Portability tracking: compile-only builds on Windows (MSVC) and macOS.
  # Linux stays the primary, fully tested platform.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake + MSVC, raylib via FetchContent)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Map discovery check
        run: build\Release\dead_arrival.exe --list-maps

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CMake + clang, raylib via FetchContent)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Map discovery check
        run: ./build/dead_arrival --list-maps
